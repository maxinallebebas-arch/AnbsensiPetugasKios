<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kios Sampah Mimika</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #F4F7F6; /* Warna background aplikasi Anda */
        }
        
        /* Ini adalah Trik untuk menyembunyikan Banner Google */
        .iframe-container {
            position: absolute;
            top: -28px; /* Mendorong layar ke atas sebanyak 28px untuk menutup banner */
            left: 0;
            width: 100%;
            height: calc(100% + 28px);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="MASUKKAN_LINK_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI"></iframe>
    </div>

</body>
</html>
